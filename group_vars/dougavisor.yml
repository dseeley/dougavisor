---

cloudinit_netplan:
  bridges:
    br0:
      addresses: [192.168.1.3/24]

autoinstall_storage:
  ## Note: The serial number is the ID_SERIAL from 'udevadm info --query=property --name /dev/nvme0n1' (with spaces replaced by underscores, if any)
  ## Boot NVME is 256060514304 bytes.  1GB for EFI partition; rest for OS.
  ## Storage NVME is 4000787030016 bytes:  4GB for /etc/libvirt/qemu; rest for /media/vdisk (virtual disks).  Initially installed with `size: -1`.  Then fixed with `size: 3811349M`, derived from `blockdev --getsize64 /dev/nvme1n1p2`.
  config:
    # OS drive
    - {type: disk,      id: disk-os,      ptable: gpt, match: {serial: 'M2_Series_NVMe_SSD_256G_21481070330918_1'}, wipe: superblock-recursive, preserve: false, grub_device: false}
    - {type: partition, id: partition-0,  device: disk-os, number: 1, size: 1024M, wipe: superblock, flag: boot, preserve: false, grub_device: true}
    - {type: format,    id: format-0,     volume: partition-0, fstype: fat32, preserve: false}
    - {type: mount,     id: mount-0,      device: format-0, path: /boot/efi}
    - {type: partition, id: partition-1,  device: disk-os, number: 2, size: -1, wipe: superblock, flag: '', preserve: false}
    - {type: format,    id: format-1,     volume: partition-1, fstype: ext4, preserve: false}
    - {type: mount,     id: mount-1,      device: format-1, path: /}

    # Data drive
    - {type: disk,      id: disk-data1,   ptable: gpt, match: {serial: 'Seagate_FireCuda_530_ZP4000GM30023_7VS00FLC_1'}, preserve: true}
    - {type: partition, id: partition-2,  device: disk-data1, number: 1, size: 4096M, label: 'etc_libvirt_qemu', preserve: true}
    - {type: format,    id: format-2,     volume: partition-2, fstype: xfs, preserve: true}
    - {type: mount,     id: mount-2,      device: format-2, path: /etc/libvirt/qemu, options: 'rw,noatime,nodiratime,attr2,inode64,logbufs=8,logbsize=256k'}
    - {type: partition, id: partition-3,  device: disk-data1, number: 2, size: 3811349M, label: 'media_vdisks', preserve: true}
    - {type: format,    id: format-3,     volume: partition-3, fstype: xfs, preserve: true}
    - {type: mount,     id: mount-3,      device: format-3, path: "{{libvirt.storage_pool}}", options: 'rw,noatime,nodiratime,attr2,inode64,logbufs=8,logbsize=256k'}